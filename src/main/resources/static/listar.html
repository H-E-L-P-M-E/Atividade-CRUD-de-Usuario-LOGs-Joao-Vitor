<form method="get" action="http://localhost:8080/carro">
    modelo <input type="text" nome="modew" id="modelo">
    <input type="submit" value="pesquisar">
</form>

    <h2>Listagem de Carro</h2>

    <button matButton="filled" type="button" (click)="novo()">
        Novo Carro
    </button>

    <hr />

    <table mat-table [dataSource]="carro()" class="mat-elevation-z8">

        <!-- ID -->
        <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef>ID:</th>
            <td mat-cell *matCellDef="let element">
                {{ carro.id }}
            </td>
        </ng-container>

        <!-- Modelo -->
        <ng-container matColumnDef="modelo">
            <th mat-header-cell *matHeaderCellDef>Modelo:</th>
            <td mat-cell *matCellDef="let element">
                {{ carro.modelo }}
            </td>
        </ng-container>

        <!-- Ano -->
        <ng-container matColumnDef="ano">
            <th mat-header-cell *matHeaderCellDef>Ano:</th>
            <td mat-cell *matCellDef="let element">
                {{ carro.ano }}
            </td>
        </ng-container>

        <!-- Preco -->
        <ng-container matColumnDef="preço">
            <th mat-header-cell *matHeaderCellDef>Preco:</th>
            <td mat-cell *matCellDef="let element">
                {{ carro.preco }}
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

        <tr
                mat-row
                *matRowDef="let row; columns: displayedColumns"
                (click)="abrirCarro(row)"
                class="linha-carro">
        </tr>

    </table>

    <h3>Total de Carros cadastrados: {{ carro().length }}</h3>
